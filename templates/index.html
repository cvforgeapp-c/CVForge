<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVForge - AI Resume & ATS Optimizer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Paddle.js v2 CDN -->
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Header / Navbar -->
  <nav class="border-b border-slate-800 bg-slate-950 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <span class="text-2xl font-black tracking-wider text-indigo-500">CVForge</span>
    </div>
    <div class="flex items-center space-x-4">
      <span class="text-sm bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full border border-slate-700">
        Credits: <strong id="user-credits" class="text-indigo-400">3</strong>
      </span>
      <button onclick="openPaddleCheckout()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-4 py-2 rounded-lg transition">
        Buy Credits
      </button>
    </div>
  </nav>

  <!-- Main Workspace -->
  <main class="max-w-4xl mx-auto py-12 px-4">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold text-white mb-2">Tailor Your Resume with AI</h1>
      <p class="text-slate-400 text-lg">Upload your resume PDF and enter the target job URL to pass ATS screeners.</p>
    </div>

    <!-- Input Card -->
    <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6 shadow-xl mb-8">
      <form id="optimize-form" class="space-y-6">
        
        <!-- File Upload -->
        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-2">Upload Resume (PDF)</label>
          <input type="file" id="cv-file" accept=".pdf" required 
            class="w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer bg-slate-900 border border-slate-700 rounded-lg p-2">
        </div>

        <!-- Job Posting URL -->
        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-2">Target Job URL</label>
          <input type="url" id="job-url" placeholder="https://linkedin.com/jobs/view/..." required
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" 
          class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-500/20">
          Optimize Resume
        </button>
      </form>
    </div>

    <!-- Progress Tracker (SSE) -->
    <div id="progress-container" class="hidden bg-slate-800/80 border border-slate-700 rounded-xl p-6 mb-8">
      <div class="flex justify-between text-sm font-semibold mb-2">
        <span id="progress-status" class="text-indigo-400">Initializing...</span>
        <span id="progress-percent" class="text-slate-300">0%</span>
      </div>
      <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-indigo-500 h-full w-0 transition-all duration-300"></div>
      </div>
    </div>

    <!-- Results Display -->
    <div id="results-container" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-6">
      <h2 class="text-2xl font-bold text-white mb-4">Optimization Results</h2>
      <div id="match-score" class="text-3xl font-black text-indigo-400 mb-4"></div>
      <pre id="results-output" class="bg-slate-900 p-4 rounded-lg text-slate-300 text-sm overflow-x-auto whitespace-pre-wrap"></pre>
    </div>
  </main>

  <script>
    // Initialize Paddle Billing Sandbox/Live
    Paddle.Environment.set('sandbox'); 
    Paddle.Initialize({ token: 'test_YOUR_PADDLE_CLIENT_TOKEN' });

    function openPaddleCheckout() {
      Paddle.Checkout.open({
        items: [{ priceId: 'pri_01h123abc...', quantity: 1 }],
        customData: { user_id: '1' }
      });
    }

    // Process Form Submission & SSE Streaming
    document.getElementById('optimize-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fileInput = document.getElementById('cv-file');
      const jobUrlInput = document.getElementById('job-url');
      const submitBtn = document.getElementById('submit-btn');
      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');
      const progressStatus = document.getElementById('progress-status');
      const progressPercent = document.getElementById('progress-percent');
      const resultsContainer = document.getElementById('results-container');

      if (!fileInput.files[0] || !jobUrlInput.value) return;

      submitBtn.disabled = true;
      progressContainer.classList.remove('hidden');
      resultsContainer.classList.add('hidden');

      // Step 1: Upload and Parse Inputs
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('job_url', jobUrlInput.value);

      try {
        const parseRes = await fetch('/api/parse', { method: 'POST', body: formData });
        const parseData = await parseRes.json();

        if (!parseRes.ok) throw new Error(parseData.error || 'Parsing failed');

        // Step 2: Listen to SSE Progress Events
        const eventSource = new EventSource('/api/optimize/stream');
        eventSource.onmessage = (event) => {
          const streamData = JSON.parse(event.data);
          progressStatus.textContent = streamData.status;
          progressPercent.textContent = streamData.progress + '%';
          progressBar.style.width = streamData.progress + '%';

          if (streamData.progress >= 100) {
            eventSource.close();
            
            // Step 3: Run AI Optimization
            fetch('/api/optimize', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ cv_text: parseData.cv_text, job_text: parseData.job_text })
            })
            .then(res => res.json())
            .then(optData => {
              submitBtn.disabled = false;
              resultsContainer.classList.remove('hidden');
              document.getElementById('match-score').textContent = `Match Score: ${optData.data.match_score}%`;
              document.getElementById('results-output').textContent = JSON.stringify(optData.data, null, 2);
            });
          }
        };
      } catch (err) {
        alert('Error: ' + err.message);
        submitBtn.disabled = false;
        progressContainer.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
